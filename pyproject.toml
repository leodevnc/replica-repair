[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "replica-repair"
version = "0.1.0"
description = "Offline causal replica repair with tombstones and Merkle reconciliation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
replica-repair = "replica_repair.__main__:main"

[tool.setuptools.packages.find]
include = ["replica_repair*"]
